services:
  # 本地配置源：可模拟慢响应 / 故障 / 挂起；按服务发布递增修订
  source:
    build: .
    command: uvicorn app.source:app --host 0.0.0.0 --port 8080
    environment:
      SOURCE_DB: /data/source.db
    volumes:
      - source-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 缓存实例 1 与 2：共享同一个 SQLite 数据库卷（WAL 模式）
  cache1:
    build: .
    command: uvicorn app.cache:app --host 0.0.0.0 --port 8081
    environment:
      CACHE_DB: /shared/cache.db
      SOURCE_BASE: http://source:8080
      INSTANCE_ID: cache1
      FETCH_TIMEOUT: "6"
      LEASE_TTL: "2"
      HEARTBEAT_INTERVAL: "0.7"
      FAILURE_COOLDOWN: "3"
    volumes:
      - cache-shared:/shared
    ports:
      - "8081:8081"
    depends_on:
      source:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache2:
    build: .
    command: uvicorn app.cache:app --host 0.0.0.0 --port 8081
    environment:
      CACHE_DB: /shared/cache.db
      SOURCE_BASE: http://source:8080
      INSTANCE_ID: cache2
      FETCH_TIMEOUT: "6"
      LEASE_TTL: "2"
      HEARTBEAT_INTERVAL: "0.7"
      FAILURE_COOLDOWN: "3"
    volumes:
      - cache-shared:/shared
    ports:
      - "8082:8081"
    depends_on:
      source:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  source-data:
  cache-shared:
